/* ---------- OCR (Tesseract.js) ---------- */
let tesseractWorker = null;
async function getOcrWorker(){
  if(tesseractWorker) return tesseractWorker;
  tesseractWorker = await Tesseract.createWorker('eng');
  return tesseractWorker;
}

async function ocrPage(p){
  const scale = 2.5; // higher DPI improves OCR accuracy
  const canvas = await renderPageComposite(p, scale);
  const worker = await getOcrWorker();
  const { data } = await worker.recognize(canvas);
  const words = (data.words || []).filter(w => w.text && w.text.trim()).map(w => ({
    text: w.text,
    rectFrac: {
      x: w.bbox.x0 / canvas.width, y: w.bbox.y0 / canvas.height,
      w: (w.bbox.x1 - w.bbox.x0) / canvas.width, h: (w.bbox.y1 - w.bbox.y0) / canvas.height
    }
  }));
  p.ocrText = data.text;
  p.ocrWords = words;
  p.textWords = null; // invalidate cache so search picks up OCR words
  return data.text;
}

el('ocrBtn').onclick = async () => {
  if(!pages.length) return;
  const p = pages[activeIndex];
  setLoading(true, 'Running OCR on this page…');
  try{
    await ocrPage(p);
    toast('OCR complete — ' + p.ocrWords.length + ' word(s) found and now searchable.');
  } catch(err){
    console.error(err);
    toast('OCR failed — see console.');
  }
  setLoading(false);
};

el('ocrAllBtn').onclick = async () => {
  if(!pages.length) return;
  for(let i=0;i<pages.length;i++){
    setLoading(true, `OCR: page ${i+1} of ${pages.length}…`);
    try{ await ocrPage(pages[i]); } catch(err){ console.error(err); }
  }
  setLoading(false);
  toast('OCR complete for all pages.');
};

/* ---------- Text-layer + OCR search ---------- */
let searchMatches = [], searchCursor = -1;

async function ensurePageTextWords(p){
  if(p.textWords) return p.textWords;
  let words = [];
  if(p.kind === 'source'){
    try{
      const page = await getPdfjsPage(p);
      const tc = await page.getTextContent();
      const total = ((page.rotate||0) + p.rotation) % 360;
      const viewport = page.getViewport({ scale: 1, rotation: total });
      tc.items.forEach(item => {
        const str = item.str;
        if(!str || !str.trim()) return;
        // item.width/item.height are already resolved to PDF user-space point
        // distances (not raw glyph-space units), and item.transform's linear
        // part (a,b,c,d) already encodes the font-size scaling used to derive
        // them. So the box must be built by walking `width` points along the
        // transform's direction — NOT by re-running width/height back through
        // the full transform matrix, which double-applies that scaling and
        // inflates the box far past the actual glyphs (previously stretched
        // highlights across an entire line or even off the page).
        const angle = Math.atan2(item.transform[1], item.transform[0]);
        const cosA = Math.cos(angle), sinA = Math.sin(angle);
        const ox = item.transform[4], oy = item.transform[5];
        const totalW = item.width || 1, totalH = item.height || Math.hypot(item.transform[2], item.transform[3]) || 10;
        // pdf.js text items are often whole lines, not single words — split by
        // character offset and distribute width proportionally so highlight
        // boxes land on individual words instead of the whole line/paragraph.
        const wordRe = /\S+/g;
        let match;
        while((match = wordRe.exec(str))){
          const x0f = match.index / str.length, x1f = (match.index + match[0].length) / str.length;
          const dx0 = x0f*totalW, dx1 = x1f*totalW;
          const corners = [[dx0,0],[dx1,0],[dx0,totalH],[dx1,totalH]].map(([dx,dy]) => {
            const ux = ox + dx*cosA - dy*sinA;
            const uy = oy + dx*sinA + dy*cosA;
            return pdfjsLib.Util.applyTransform([ux, uy], viewport.transform);
          });
          const xs = corners.map(c=>c[0]), ys = corners.map(c=>c[1]);
          const gx0=Math.min(...xs), gx1=Math.max(...xs), gy0=Math.min(...ys), gy1=Math.max(...ys);
          words.push({ text: match[0], rectFrac: {
            x: gx0/viewport.width, y: gy0/viewport.height,
            w: (gx1-gx0)/viewport.width, h: (gy1-gy0)/viewport.height
          }});
        }
      });
    } catch(err){ console.warn('text extraction failed', err); }
  }
  if(words.length === 0 && p.ocrWords && p.ocrWords.length) words = p.ocrWords;
  p.textWords = words;
  return words;
}

async function runSearch(query){
  query = query.trim().toLowerCase();
  pages.forEach(p => p.searchHighlights = null);
  searchMatches = []; searchCursor = -1;
  el('searchCount').textContent = '';
  if(!query){ redrawOverlay(); return; }
  for(let i=0;i<pages.length;i++){
    const words = await ensurePageTextWords(pages[i]);
    if(words.some(w => w.text.toLowerCase().includes(query))) searchMatches.push(i);
  }
  if(!searchMatches.length){ toast('No matches found. Try OCR-ing scanned pages first.'); return; }
  searchCursor = 0;
  await gotoSearchMatch();
}

async function gotoSearchMatch(){
  if(searchCursor < 0 || searchCursor >= searchMatches.length) return;
  const query = el('searchInput').value.trim().toLowerCase();
  const pageIdx = searchMatches[searchCursor];
  activeIndex = pageIdx;
  const words = await ensurePageTextWords(pages[pageIdx]);
  pages[pageIdx].searchHighlights = words.filter(w => w.text.toLowerCase().includes(query)).map(w => w.rectFrac);
  scrollToPage(pageIdx, true);
  await renderVisiblePages();
  redrawOverlayFor(pageIdx);
  el('searchCount').textContent = (searchCursor+1) + '/' + searchMatches.length;
}
function searchNext(){ if(!searchMatches.length) return; searchCursor = (searchCursor+1) % searchMatches.length; gotoSearchMatch(); }
function searchPrev(){ if(!searchMatches.length) return; searchCursor = (searchCursor-1+searchMatches.length) % searchMatches.length; gotoSearchMatch(); }

el('searchInput').addEventListener('keydown', e => {
  e.stopPropagation();
  if(e.key === 'Enter'){
    e.preventDefault();
    if(e.shiftKey) searchPrev();
    else if(searchMatches.length && el('searchInput')._lastQuery === el('searchInput').value) searchNext();
    else runSearch(el('searchInput').value);
    el('searchInput')._lastQuery = el('searchInput').value;
  }
});
el('searchPrevBtn').onclick = searchPrev;
el('searchNextBtn').onclick = searchNext;

/* ---------- Form-filling (AcroForm) ---------- */
let formDocIdx = null, formFieldsByPage = {}, formValues = {}, formFieldsVisible = true;

async function detectForm(docIdx){
  formDocIdx = null; formFieldsByPage = {}; formValues = {};
  try{
    const libDoc = await getPdfLibDoc(docIdx);
    let form;
    try{ form = libDoc.getForm(); } catch(e){ return; }
    const fields = form.getFields();
    if(!fields.length) return;
    const PDFName = PDFLib.PDFName;
    const nameToField = {};
    fields.forEach(f => nameToField[f.getName()] = f);

    function resolveFieldName(dict, ctx, depth){
      if(depth > 12 || !dict) return null;
      try{
        const t = dict.lookup(PDFName.of('T'));
        if(t) return (typeof t.decodeText === 'function') ? t.decodeText() : String(t);
      } catch(e){}
      try{
        const parentRef = dict.get(PDFName.of('Parent'));
        if(parentRef){
          const parentDict = ctx.lookup(parentRef);
          if(parentDict) return resolveFieldName(parentDict, ctx, depth+1);
        }
      } catch(e){}
      return null;
    }

    const ctx = libDoc.context;
    const pdfPages = libDoc.getPages();
    for(let i=0;i<pdfPages.length;i++){
      let annotsArr;
      try{ annotsArr = pdfPages[i].node.lookup(PDFName.of('Annots')); } catch(e){ annotsArr = null; }
      if(!annotsArr) continue;
      const n = annotsArr.size();
      for(let j=0;j<n;j++){
        let annotDict;
        try{ annotDict = annotsArr.lookup(j); } catch(e){ continue; }
        if(!annotDict) continue;
        const fname = resolveFieldName(annotDict, ctx, 0);
        if(!fname || !nameToField[fname]) continue;
        if(formFieldsByPage[i] && formFieldsByPage[i].some(e => e.name === fname)) continue;
        let rect;
        try{
          const rectArr = annotDict.lookup(PDFName.of('Rect'));
          const nums = [0,1,2,3].map(k => rectArr.lookup(k).asNumber());
          const x = Math.min(nums[0],nums[2]), y = Math.min(nums[1],nums[3]);
          const w = Math.abs(nums[2]-nums[0]), h = Math.abs(nums[3]-nums[1]);
          rect = [x,y,w,h];
        } catch(e){ continue; }
        const field = nameToField[fname];
        let type=null, options=null, defaultValue=null;
        if(field instanceof PDFLib.PDFTextField){ type='text'; try{ defaultValue = field.getText()||''; }catch(e){} }
        else if(field instanceof PDFLib.PDFCheckBox){ type='checkbox'; try{ defaultValue = field.isChecked(); }catch(e){} }
        else if(field instanceof PDFLib.PDFDropdown || field instanceof PDFLib.PDFOptionList){
          type='choice'; try{ options = field.getOptions(); }catch(e){ options=[]; }
          try{ const sel = field.getSelected(); defaultValue = sel && sel[0]; }catch(e){}
        } else if(field instanceof PDFLib.PDFRadioGroup){
          type='choice'; try{ options = field.getOptions(); }catch(e){ options=[]; }
          try{ defaultValue = field.getSelected(); }catch(e){}
        } else { continue; } // buttons/signatures unsupported

        if(!formFieldsByPage[i]) formFieldsByPage[i] = [];
        formFieldsByPage[i].push({ name: fname, type, rect, options, defaultValue });
        if(!(fname in formValues)) formValues[fname] = defaultValue;
      }
    }
    if(Object.keys(formFieldsByPage).length) formDocIdx = docIdx;
  } catch(e){
    console.warn('Form detection failed', e);
    formDocIdx = null; formFieldsByPage = {};
  }
}

async function renderFormFieldOverlay(idx){
  if(idx == null) idx = activeIndex;
  const layer = formLayerFor(idx);
  if(!layer) return;
  layer.innerHTML = '';
  if(!pages.length) return;
  const p = pages[idx];
  const ov = overlayFor(idx);
  if(ov){ layer.style.width = ov.style.width; layer.style.height = ov.style.height; }
  if(!formFieldsVisible || p.kind !== 'source' || p.srcDocIdx !== formDocIdx) return;
  const entries = formFieldsByPage[p.srcPageNum-1];
  if(!entries || !entries.length) return;
  const page = await getPdfjsPage(p);
  const total = ((page.rotate||0) + p.rotation) % 360;
  const viewport = page.getViewport({ scale: zoom, rotation: total });
  entries.forEach(fieldEntry => {
    const [rx,ry,rw,rh] = fieldEntry.rect;
    const [vx1,vy1,vx2,vy2] = viewport.convertToViewportRectangle([rx, ry, rx+rw, ry+rh]);
    const left = Math.min(vx1,vx2), top = Math.min(vy1,vy2);
    const width = Math.max(4, Math.abs(vx2-vx1)), height = Math.max(4, Math.abs(vy2-vy1));
    let inputEl;
    if(fieldEntry.type === 'text'){
      inputEl = document.createElement('textarea');
      inputEl.value = formValues[fieldEntry.name] ?? '';
      inputEl.style.fontSize = Math.max(9, height*0.7) + 'px';
      inputEl.addEventListener('input', () => formValues[fieldEntry.name] = inputEl.value);
    } else if(fieldEntry.type === 'checkbox'){
      inputEl = document.createElement('input');
      inputEl.type = 'checkbox';
      inputEl.checked = !!formValues[fieldEntry.name];
      inputEl.addEventListener('change', () => formValues[fieldEntry.name] = inputEl.checked);
    } else if(fieldEntry.type === 'choice'){
      inputEl = document.createElement('select');
      (fieldEntry.options||[]).forEach(o => {
        const opt = document.createElement('option'); opt.value = o; opt.textContent = o;
        inputEl.appendChild(opt);
      });
      inputEl.value = formValues[fieldEntry.name] ?? '';
      inputEl.style.fontSize = Math.max(9, height*0.6) + 'px';
      inputEl.addEventListener('change', () => formValues[fieldEntry.name] = inputEl.value);
    } else return;
    inputEl.className = 'form-field-input';
    inputEl.title = fieldEntry.name;
    inputEl.style.left = left + 'px';
    inputEl.style.top = top + 'px';
    inputEl.style.width = width + 'px';
    inputEl.style.height = height + 'px';
    layer.appendChild(inputEl);
  });
}

async function applyFormValuesAndFlatten(){
  if(formDocIdx == null) return;
  const libDoc = await getPdfLibDoc(formDocIdx);
  let form;
  try{ form = libDoc.getForm(); } catch(e){ return; }
  const fields = form.getFields();
  if(!fields.length) return; // already flattened, or nothing to do
  fields.forEach(f => {
    const name = f.getName();
    if(!(name in formValues)) return;
    const val = formValues[name];
    try{
      if(f instanceof PDFLib.PDFTextField) f.setText(val || '');
      else if(f instanceof PDFLib.PDFCheckBox){ if(val) f.check(); else f.uncheck(); }
      else if((f instanceof PDFLib.PDFDropdown || f instanceof PDFLib.PDFOptionList || f instanceof PDFLib.PDFRadioGroup) && val) f.select(val);
    } catch(err){ console.warn('could not set field', name, err); }
  });
  try{ form.flatten(); } catch(err){ console.warn('flatten failed', err); }
}

el('formToggleBtn').onclick = () => {
  formFieldsVisible = !formFieldsVisible;
  el('formToggleBtn').classList.toggle('active', formFieldsVisible);
  for(let i=0;i<pages.length;i++) renderFormFieldOverlay(i);
};

/* ---------- Save (export) ---------- */
async function getPdfLibDoc(idx){
  const d = docs[idx];
  if(!d.pdfLibDoc) d.pdfLibDoc = await PDFLib.PDFDocument.load(d.arrayBuffer);
  return d.pdfLibDoc;
}

async function buildExportDoc(pageSubset){
  const outDoc = await PDFLib.PDFDocument.create();
  for(const p of pageSubset){
    if(p.annotations.length === 0 && p.kind === 'source'){
      const srcLib = await getPdfLibDoc(p.srcDocIdx);
      const [copied] = await outDoc.copyPages(srcLib, [p.srcPageNum-1]);
      outDoc.addPage(copied);
      if(p.rotation){
        const angle = (copied.getRotation().angle + p.rotation) % 360;
        copied.setRotation(PDFLib.degrees(angle));
      }
    } else if(p.annotations.length === 0 && p.kind === 'blank'){
      outDoc.addPage([p.blankSize.w, p.blankSize.h]);
    } else {
      const { viewport: pt1 } = await getBaseViewport(p, 1);
      const canvas = await renderPageComposite(p, 2.3);
      const dataUrl = canvas.toDataURL('image/png');
      const pngImage = await outDoc.embedPng(dataUrl);
      const newPage = outDoc.addPage([pt1.width, pt1.height]);
      newPage.drawImage(pngImage, { x:0, y:0, width: pt1.width, height: pt1.height });
    }
  }
  return outDoc;
}

function downloadBytes(bytes, filename){
  const blob = new Blob([bytes], { type:'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

el('saveBtn').onclick = async () => {
  setLoading(true, 'Building your PDF…');
  try{
    await applyFormValuesAndFlatten();
    const outDoc = await buildExportDoc(pages);
    const bytes = await outDoc.save();
    downloadBytes(bytes, originalName + '-edited.pdf');
    toast('Saved ' + pages.length + '-page PDF');
  } catch(err){
    console.error(err);
    toast('Something went wrong building the PDF — see console.');
  }
  setLoading(false);
};

/* ---------- Digital signatures (PAdES-style CMS/PKCS#7) ----------
   Produces a real ISO 32000 /Sig dictionary with a detached CMS signature —
   an eIDAS Advanced Electronic Signature (self-signed, or backed by an
   imported CA/QTSP certificate), not a Qualified signature. See the
   in-modal disclosure for the legal distinction. */
const SIGN_IDENTITY_KEY = 'quickview_signing_identity';
const SIGN_IDENTITY_META_KEY = 'quickview_signing_identity_meta';
let signIdentity = null; // { privateKey, cert, chain, name, email, org } — session-only, re-unlocked from localStorage each load

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return String(n).padStart(2,'0'); }
function toPdfDate(d){
  return `D:${d.getUTCFullYear()}${pad2(d.getUTCMonth()+1)}${pad2(d.getUTCDate())}${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}${pad2(d.getUTCSeconds())}+00'00'`;
}
function randomSerialHex(){
  // ensure the high bit of the first byte is clear so the DER INTEGER reads as positive
  let hex = forge.util.bytesToHex(forge.random.getBytesSync(9));
  if(parseInt(hex.substring(0,2),16) & 0x80) hex = '00' + hex;
  return hex;
}
function certAttr(cert, name){
  const a = cert.subject.attributes.find(x => x.name === name);
  return a ? a.value : '';
}
function certFingerprint(cert){
  const der = forge.asn1.toDer(forge.pki.certificateToAsn1(cert)).getBytes();
  return forge.md.sha256.create().update(der).digest().toHex().toUpperCase().replace(/(..)(?=.)/g, '$1:');
}
// Convert a Uint8Array to a plain JS "binary string" (one char per byte) —
// what forge's util functions expect — chunked so a large PDF doesn't blow
// the call stack via a single String.fromCharCode(...spread).
function bytesToLatin1(bytes){
  let out = '';
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) out += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return out;
}

// RSA-2048 keygen is synchronous in forge; yield one tick first so the
// spinner/disabled state actually paints before the (blocking) generation.
function generateKeyPairAsync(bits){
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      try{ resolve(forge.pki.rsa.generateKeyPair({ bits })); }
      catch(e){ reject(e); }
    }, 30);
  });
}

function persistIdentity(privateKey, cert, passphrase, meta){
  const p12Asn1 = forge.pkcs12.toPkcs12Asn1(privateKey, [cert], passphrase, { algorithm: '3des' });
  const der = forge.asn1.toDer(p12Asn1).getBytes();
  localStorage.setItem(SIGN_IDENTITY_KEY, forge.util.encode64(der));
  // Name/email/org aren't secret — they're already in the cert's Subject,
  // which ends up in the signed PDF — so a plaintext summary alongside the
  // encrypted blob is fine and lets the "locked" modal state greet the user
  // by name without asking for the passphrase first.
  localStorage.setItem(SIGN_IDENTITY_META_KEY, JSON.stringify(meta));
}

async function createSigningIdentity({ name, email, org, passphrase }){
  const keys = await generateKeyPairAsync(2048);
  const cert = forge.pki.createCertificate();
  cert.publicKey = keys.publicKey;
  cert.serialNumber = randomSerialHex();
  const now = new Date();
  cert.validity.notBefore = now;
  const notAfter = new Date(now); notAfter.setFullYear(now.getFullYear() + 3);
  cert.validity.notAfter = notAfter;
  const attrs = [{ name:'commonName', value: name }, { name:'emailAddress', value: email }];
  if(org) attrs.push({ name:'organizationName', value: org });
  cert.setSubject(attrs);
  cert.setIssuer(attrs); // self-signed: issuer === subject
  cert.setExtensions([
    { name:'basicConstraints', cA: false },
    { name:'keyUsage', digitalSignature: true, nonRepudiation: true },
    { name:'extKeyUsage', emailProtection: true }
  ]);
  cert.sign(keys.privateKey, forge.md.sha256.create());
  persistIdentity(keys.privateKey, cert, passphrase, { name, email, org });
  signIdentity = { privateKey: keys.privateKey, cert, chain: [], name, email, org };
  return signIdentity;
}

function parseP12(der, passphrase){
  const asn1 = forge.asn1.fromDer(der);
  const p12 = forge.pkcs12.pkcs12FromAsn1(asn1, passphrase);
  const certBags = (p12.getBags({ bagType: forge.pki.oids.certBag })[forge.pki.oids.certBag]) || [];
  let keyBags = (p12.getBags({ bagType: forge.pki.oids.pkcs8ShroudedKeyBag })[forge.pki.oids.pkcs8ShroudedKeyBag]) || [];
  if(!keyBags.length) keyBags = (p12.getBags({ bagType: forge.pki.oids.keyBag })[forge.pki.oids.keyBag]) || [];
  if(!certBags.length || !keyBags.length) throw new Error('No certificate/private key found in file.');
  const keyBag = keyBags[0];
  const leafBag = certBags.find(b => keyBag.attributes && b.attributes &&
    JSON.stringify(b.attributes.localKeyId) === JSON.stringify(keyBag.attributes.localKeyId)) || certBags[0];
  const cert = leafBag.cert;
  const chain = certBags.map(b => b.cert).filter(c => c !== cert);
  return { privateKey: keyBag.key, cert, chain };
}

function unlockStoredIdentity(passphrase){
  const b64 = localStorage.getItem(SIGN_IDENTITY_KEY);
  if(!b64) throw new Error('No saved signing identity.');
  const der = forge.util.decode64(b64);
  const { privateKey, cert, chain } = parseP12(der, passphrase);
  signIdentity = {
    privateKey, cert, chain,
    name: certAttr(cert, 'commonName') || 'Signer',
    email: certAttr(cert, 'emailAddress') || '',
    org: certAttr(cert, 'organizationName') || ''
  };
  return signIdentity;
}

async function importP12File(file, passphrase){
  const buf = new Uint8Array(await file.arrayBuffer());
  const der = forge.util.binary.raw.encode(buf);
  const { privateKey, cert, chain } = parseP12(der, passphrase);
  const name = certAttr(cert, 'commonName') || 'Signer';
  const email = certAttr(cert, 'emailAddress') || '';
  const org = certAttr(cert, 'organizationName') || '';
  persistIdentity(privateKey, cert, passphrase, { name, email, org });
  signIdentity = { privateKey, cert, chain, name, email, org };
  return signIdentity;
}

function clearSigningIdentity(){
  signIdentity = null;
  localStorage.removeItem(SIGN_IDENTITY_KEY);
  localStorage.removeItem(SIGN_IDENTITY_META_KEY);
}

// Best-effort, non-cryptographic scan for an existing signature so the
// toolbar can show a "Signed" badge — not a validity check.
function detectExistingSignature(buf){
  try{
    const bytes = new Uint8Array(buf);
    const scanLen = Math.min(bytes.length, 5_000_000);
    let str = '';
    const chunk = 0x8000;
    for(let i=0;i<scanLen;i+=chunk) str += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i+chunk, scanLen)));
    return /\/Type\s*\/Sig\b/.test(str) && /\/ByteRange/.test(str);
  } catch(e){ return false; }
}

// Reserve a placeholder /Sig field + widget + AcroForm entry on a pdf-lib
// PDFDocument using the low-level context API, so the field's on-disk byte
// offsets are known before we've computed the signature that fills them.
function addSignaturePlaceholder(pdfDoc, identity, sigLengthBytes){
  const { PDFName, PDFHexString, PDFArray, PDFNumber, PDFString, PDFDict } = PDFLib;
  const context = pdfDoc.context;
  const contentsPlaceholder = '0'.repeat(sigLengthBytes * 2);

  const sigDictMap = new Map();
  sigDictMap.set(PDFName.of('Type'), PDFName.of('Sig'));
  sigDictMap.set(PDFName.of('Filter'), PDFName.of('Adobe.PPKLite'));
  sigDictMap.set(PDFName.of('SubFilter'), PDFName.of('adbe.pkcs7.detached'));
  sigDictMap.set(PDFName.of('ByteRange'), context.obj([0, 9999999999, 9999999999, 9999999999]));
  sigDictMap.set(PDFName.of('Contents'), PDFHexString.of(contentsPlaceholder));
  sigDictMap.set(PDFName.of('M'), PDFString.of(toPdfDate(new Date())));
  sigDictMap.set(PDFName.of('Name'), PDFString.of(identity.name || 'Signer'));
  sigDictMap.set(PDFName.of('Reason'), PDFString.of('Document signed via Quickview'));
  if(identity.email) sigDictMap.set(PDFName.of('ContactInfo'), PDFString.of(identity.email));
  const sigRef = context.register(PDFDict.fromMapWithContext(sigDictMap, context));

  const page0 = pdfDoc.getPages()[0];
  const widgetMap = new Map();
  widgetMap.set(PDFName.of('Type'), PDFName.of('Annot'));
  widgetMap.set(PDFName.of('Subtype'), PDFName.of('Widget'));
  widgetMap.set(PDFName.of('FT'), PDFName.of('Sig'));
  widgetMap.set(PDFName.of('Rect'), context.obj([0, 0, 0, 0]));
  widgetMap.set(PDFName.of('V'), sigRef);
  widgetMap.set(PDFName.of('T'), PDFString.of('Signature1'));
  widgetMap.set(PDFName.of('F'), PDFNumber.of(132));
  widgetMap.set(PDFName.of('P'), page0.ref);
  const widgetRef = context.register(PDFDict.fromMapWithContext(widgetMap, context));

  let annots = page0.node.lookup(PDFName.of('Annots'));
  if(!(annots instanceof PDFArray)){
    annots = context.obj([]);
    page0.node.set(PDFName.of('Annots'), annots);
  }
  annots.push(widgetRef);

  const catalog = pdfDoc.catalog;
  let acroForm = catalog.lookup(PDFName.of('AcroForm'));
  if(!(acroForm instanceof PDFDict)){
    const acroMap = new Map();
    acroMap.set(PDFName.of('Fields'), context.obj([widgetRef]));
    acroMap.set(PDFName.of('SigFlags'), PDFNumber.of(3)); // SignaturesExist | AppendOnly
    catalog.set(PDFName.of('AcroForm'), context.register(PDFDict.fromMapWithContext(acroMap, context)));
  } else {
    let fields = acroForm.lookup(PDFName.of('Fields'));
    if(!(fields instanceof PDFArray)){
      fields = context.obj([]);
      acroForm.set(PDFName.of('Fields'), fields);
    }
    fields.push(widgetRef);
    acroForm.set(PDFName.of('SigFlags'), PDFNumber.of(3));
  }
  return contentsPlaceholder;
}

// The whole two-pass placeholder-then-patch signing flow. Reuses the same
// export pipeline as "Save PDF" (flattened annotations/forms) but keeps the
// intermediate pdf-lib PDFDocument around instead of calling .save() on it
// immediately, so a signature field can be injected first.
async function signPdfBytes(identity){
  const sigLengthBytes = 8192; // generous room for an RSA-2048 CMS sig + cert chain

  await applyFormValuesAndFlatten();
  const outDoc = await buildExportDoc(pages);
  const contentsPlaceholder = addSignaturePlaceholder(outDoc, identity, sigLengthBytes);

  const bytes = await outDoc.save({ useObjectStreams: false });

  const str = bytesToLatin1(bytes);
  const hexStart = str.indexOf(contentsPlaceholder);
  if(hexStart < 0) throw new Error('Could not locate the signature placeholder in the exported PDF.');
  if(str.indexOf(contentsPlaceholder, hexStart + 1) >= 0) throw new Error('Signature placeholder is ambiguous — found more than once.');
  const hexEnd = hexStart + contentsPlaceholder.length;

  const sentinel = '9999999999';
  const offsets = [];
  let searchFrom = 0;
  for(let i=0;i<3;i++){
    const idx = str.indexOf(sentinel, searchFrom);
    if(idx < 0) throw new Error('Could not locate the ByteRange placeholder in the exported PDF.');
    offsets.push(idx);
    searchFrom = idx + sentinel.length;
  }

  const A = hexStart, B = hexEnd, C = bytes.length - hexEnd;
  function padNum(n){
    const s = String(n);
    if(s.length > 10) throw new Error('This PDF is too large for the reserved ByteRange field.');
    return s + ' '.repeat(10 - s.length); // right-pad with spaces, not zeros — trailing whitespace terminates a PDF integer token cleanly
  }
  const patched = new Uint8Array(bytes); // copy — patch in place, keep `bytes` for reference
  [A, B, C].forEach((n, i) => {
    const s = padNum(n);
    for(let j=0;j<10;j++) patched[offsets[i]+j] = s.charCodeAt(j);
  });

  // Hash exactly the two byte ranges ByteRange now names (patching ByteRange
  // doesn't touch file length or the Contents hex region, so hashing after
  // the patch is safe and simplest).
  const range1 = patched.subarray(0, A);
  const range2 = patched.subarray(B, B + C);

  const p7 = forge.pkcs7.createSignedData();
  p7.content = forge.util.createBuffer();
  p7.content.putBytes(forge.util.binary.raw.encode(range1));
  p7.content.putBytes(forge.util.binary.raw.encode(range2));
  p7.addCertificate(identity.cert);
  (identity.chain || []).forEach(c => p7.addCertificate(c));
  p7.addSigner({
    key: identity.privateKey,
    certificate: identity.cert,
    digestAlgorithm: forge.pki.oids.sha256,
    authenticatedAttributes: [
      { type: forge.pki.oids.contentType, value: forge.pki.oids.data },
      { type: forge.pki.oids.messageDigest }, // forge fills this in from p7.content during sign()
      { type: forge.pki.oids.signingTime, value: new Date() }
    ]
  });
  p7.sign({ detached: true });

  const derBytes = forge.asn1.toDer(p7.toAsn1()).getBytes();
  let hex = forge.util.bytesToHex(derBytes);
  if(hex.length > sigLengthBytes * 2) throw new Error('The signature exceeded the reserved space — please retry.');
  hex = hex + '0'.repeat(sigLengthBytes * 2 - hex.length); // pad; DER parsers stop at the declared SEQUENCE length

  for(let j=0;j<hex.length;j++) patched[hexStart+j] = hex.charCodeAt(j);
  return patched;
}

/* ---------- Sign modal UI ---------- */
const SIGN_DISCLOSURE_HTML = `This produces a cryptographically signed, tamper-evident PDF
  (a PAdES-style ISO&nbsp;32000 <code>/Sig</code> with a detached CMS/PKCS#7 signature) —
  an eIDAS &ldquo;Advanced Electronic Signature&rdquo; when your certificate is tied to a
  verified identity, or a self-signed one for lower-stakes use — and it satisfies the
  U.S. ESIGN Act. It is <b>not</b> an eIDAS &ldquo;Qualified&rdquo; signature, which by law
  requires a certificate from a licensed EU Trust Service Provider issued on a certified
  device. If you have a <code>.p12</code> from one, import it below.`;

function showSignError(msg){
  const err = el('signError');
  if(err){ err.textContent = msg; err.style.display = ''; }
  else toast(msg);
}

function identitySummaryHtml(identity){
  return `<div class="identity-card">
    <div><b>${escapeHtml(identity.name)}</b></div>
    <div>${escapeHtml(identity.email)}</div>
    ${identity.org ? `<div>${escapeHtml(identity.org)}</div>` : ''}
    <div>Serial: ${identity.cert.serialNumber}</div>
    <div>Fingerprint: ${certFingerprint(identity.cert)}</div>
    <div>Expires: ${identity.cert.validity.notAfter.toDateString()}</div>
  </div>`;
}

function renderSignModal(){
  const body = el('signModalBody');
  if(signIdentity){
    body.innerHTML = `
      ${identitySummaryHtml(signIdentity)}
      <button class="modal-btn primary" id="doSignBtn">Sign this document</button>
      <div style="text-align:center;margin-top:10px;"><button class="modal-link" id="switchIdBtn">Use a different identity</button></div>
      <div class="modal-fineprint">${SIGN_DISCLOSURE_HTML}</div>`;
    el('doSignBtn').onclick = doSignDocument;
    el('switchIdBtn').onclick = () => {
      if(confirm('This clears your saved signing certificate from this browser. You will need to create or import one again to sign. Continue?')){
        clearSigningIdentity();
        renderSignModal();
      }
    };
    return;
  }
  const hasStored = !!localStorage.getItem(SIGN_IDENTITY_KEY);
  if(hasStored){
    let meta = {};
    try{ meta = JSON.parse(localStorage.getItem(SIGN_IDENTITY_META_KEY) || '{}'); } catch(e){}
    body.innerHTML = `
      <p style="margin:0 0 12px;font-size:13px;">Unlock your signing certificate${meta.name ? ' for <b>'+escapeHtml(meta.name)+'</b>' : ''}.</p>
      <label for="unlockPass">Passphrase</label>
      <input type="password" id="unlockPass" autocomplete="current-password">
      <div class="modal-error" id="signError" style="display:none;"></div>
      <button class="modal-btn primary" id="unlockBtn">Unlock</button>
      <div style="text-align:center;margin-top:10px;"><button class="modal-link" id="switchIdBtn2">Use a different identity</button></div>`;
    const doUnlock = () => {
      try{
        unlockStoredIdentity(el('unlockPass').value);
        renderSignModal();
      } catch(e){ showSignError('Wrong passphrase, or the saved certificate is corrupted.'); }
    };
    el('unlockBtn').onclick = doUnlock;
    el('unlockPass').addEventListener('keydown', e => { if(e.key==='Enter') doUnlock(); });
    el('switchIdBtn2').onclick = () => {
      if(confirm('This clears your saved signing certificate from this browser. Continue?')){
        clearSigningIdentity();
        renderSignModal();
      }
    };
    return;
  }
  body.innerHTML = `
    <label for="idName">Name *</label>
    <input type="text" id="idName" autocomplete="name">
    <label for="idEmail">Email *</label>
    <input type="email" id="idEmail" autocomplete="email">
    <label for="idOrg">Organization (optional)</label>
    <input type="text" id="idOrg" autocomplete="organization">
    <label for="idPass">Passphrase</label>
    <input type="password" id="idPass" autocomplete="new-password">
    <div style="font-size:11px;color:var(--muted);margin-top:4px;">Protect your signing key with a passphrase — you'll need it to sign again later.</div>
    <div class="modal-error" id="signError" style="display:none;"></div>
    <button class="modal-btn primary" id="createIdBtn">Create signing certificate</button>
    <div class="modal-sep">or</div>
    <button class="modal-btn" id="importIdBtn">Import existing certificate (.p12/.pfx)</button>
    <div class="modal-fineprint">${SIGN_DISCLOSURE_HTML}</div>`;
  el('createIdBtn').onclick = onCreateIdentityClick;
  el('importIdBtn').onclick = () => el('p12Input').click();
}

async function onCreateIdentityClick(){
  const name = el('idName').value.trim();
  const email = el('idEmail').value.trim();
  const org = el('idOrg').value.trim();
  const passphrase = el('idPass').value;
  if(!name || !email){ showSignError('Name and email are required.'); return; }
  if(!passphrase){ showSignError('Choose a passphrase to protect your signing key.'); return; }
  const btn = el('createIdBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="modal-spinner"></span>Generating key pair…';
  try{
    await createSigningIdentity({ name, email, org, passphrase });
    toast('Signing certificate created');
    renderSignModal();
  } catch(e){
    console.error(e);
    showSignError('Could not generate a certificate — see console.');
    btn.disabled = false; btn.textContent = 'Create signing certificate';
  }
}

el('p12Input').onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const passphrase = prompt('Enter the passphrase for this .p12/.pfx file:');
  if(passphrase == null) return;
  setLoading(true, 'Importing certificate…');
  try{
    await importP12File(file, passphrase);
    toast('Signing certificate imported');
    renderSignModal();
  } catch(err){
    console.error(err);
    toast('Could not import — wrong passphrase or unsupported file.');
  }
  setLoading(false);
};

async function doSignDocument(){
  const btn = el('doSignBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="modal-spinner"></span>Signing…'; }
  setLoading(true, 'Signing document…');
  try{
    const signedBytes = await signPdfBytes(signIdentity);
    downloadBytes(signedBytes, originalName + '-signed.pdf');
    toast('Document signed');
    closeSignModal();
  } catch(e){
    console.error(e);
    toast('Signing failed — see console.');
    if(btn){ btn.disabled = false; btn.textContent = 'Sign this document'; }
  }
  setLoading(false);
}

function openSignModal(){
  el('signOverlay').style.display = 'flex';
  renderSignModal();
}
function closeSignModal(){ el('signOverlay').style.display = 'none'; }
el('signBtn').onclick = openSignModal;
el('signCloseBtn').onclick = closeSignModal;
el('signOverlay').addEventListener('click', e => { if(e.target.id === 'signOverlay') closeSignModal(); });

/* ---------- Print (renders composite pages, annotations included) ---------- */
el('printBtn').onclick = async () => {
  if(!pages.length) return;
  setLoading(true, 'Preparing print view…');
  const printArea = el('printArea');
  printArea.innerHTML = '';
  for(const p of pages){
    const canvas = await renderPageComposite(p, 2.2);
    const wrap = document.createElement('div'); wrap.className='print-page';
    const img = document.createElement('img'); img.src = canvas.toDataURL('image/png');
    wrap.appendChild(img); printArea.appendChild(wrap);
  }
  setLoading(false);
  setTimeout(() => window.print(), 50);
};

/* ---------- Keyboard shortcuts ---------- */
window.addEventListener('keydown', e => {
  if(!pages.length) return;
  const tag = (document.activeElement.tagName||'').toLowerCase();
  if(tag === 'input' || tag==='textarea') return;
  if(e.key === 'ArrowRight') el('nextBtn').click();
  if(e.key === 'ArrowLeft') el('prevBtn').click();
  if((e.metaKey||e.ctrlKey) && e.key==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.metaKey||e.ctrlKey) && (e.key==='y' || (e.key==='z'&&e.shiftKey))){ e.preventDefault(); redo(); }
  if((e.metaKey||e.ctrlKey) && e.key==='p'){ e.preventDefault(); el('printBtn').click(); }
  if((e.metaKey||e.ctrlKey) && e.key==='s'){ e.preventDefault(); el('saveBtn').click(); }
  if((e.metaKey||e.ctrlKey) && e.key==='c' && fullSelectionWordCount()){ e.preventDefault(); copySelectionToClipboard(); }
  if((e.metaKey||e.ctrlKey) && e.key==='a' && currentTool==='select'){ e.preventDefault(); selectAllOnPage(); }
  if(e.key === 'Escape' && fullSelectionWordCount()){ clearTextSelection(); }
});
</script>
</body>
</html>
