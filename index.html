<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quickview-v4.0 — PDF Editor</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="">
<script>
  // Defaults to an inline SVG icon (red document + blue "PDF" magnifying
  // glass, background removed so it isn't boxed in a white square), then
  // upgrades to assets/icon.png once one is added to the repo — probed with
  // an Image() load rather than a <link> error listener, since browsers
  // don't reliably fire error events for failed favicon <link> fetches.
  (function(){
    var link = document.getElementById('favicon');
    var svgFallback = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
      '<path d="M9,3 H19 L26,10 V27 Q26,29 24,29 H9 Q7,29 7,27 V5 Q7,3 9,3 Z" fill="#DC3B30"/>' +
      '<path d="M19,3 L19,10 H26 Z" fill="#F2A69C"/>' +
      '<circle cx="15" cy="15" r="8.3" fill="#fff"/>' +
      '<circle cx="15" cy="15" r="7.0" fill="#2F6FAD"/>' +
      '<circle cx="15" cy="15" r="5.0" fill="#fff"/>' +
      '<line x1="20.9" y1="20.9" x2="24.4" y2="24.4" stroke="#fff" stroke-width="3.9" stroke-linecap="round"/>' +
      '<line x1="20.9" y1="20.9" x2="24" y2="24" stroke="#2F6FAD" stroke-width="2.7" stroke-linecap="round"/>' +
      '<text x="15" y="16" font-family="Arial, sans-serif" font-size="4.1" font-weight="800" fill="#2F6FAD" text-anchor="middle" dominant-baseline="middle">PDF</text>' +
      '</svg>'
    );
    link.href = svgFallback;
    var probe = new Image();
    probe.onload = function(){ link.type = 'image/png'; link.href = 'assets/icon.png'; };
    probe.src = 'assets/icon.png';
  })();
</script>
<style>
  :root{
    --ink:#1c2128; --paper:#fff; --backdrop:#e7e4de;
    --toolbar:#23272f; --toolbar-text:#e9e9e9;
    --accent:#2c5f6f; --accent-hover:#234d5a;
    --danger:#a83f3f; --line:#d3cfc6; --muted:#6b6f76;
    --side:#f2efe8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--backdrop);color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;}
  button{font-family:inherit;}

  /* Toolbar */
  #toolbar{background:var(--toolbar);color:var(--toolbar-text);display:flex;align-items:center;gap:8px;padding:0 12px;height:52px;flex:0 0 auto;font-size:13px;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,.2);overflow-x:auto;}
  #toolbar .brand{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;margin-right:4px;white-space:nowrap;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:#7fb8c9;}
  .sep{width:1px;height:24px;background:rgba(255,255,255,.15);flex:0 0 auto;}
  .tb-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--toolbar-text);padding:7px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;flex:0 0 auto;}
  .tb-btn:hover{background:rgba(255,255,255,.13);}
  .tb-btn:disabled{opacity:.3;cursor:not-allowed;}
  .tb-btn.primary{background:var(--accent);border-color:var(--accent);font-weight:600;}
  .tb-btn.primary:hover{background:var(--accent-hover);}
  .tb-btn.active{background:var(--accent);border-color:var(--accent);}
  #fileName{color:#9aa0a8;font-size:11.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #spacer{flex:1;}
  #pageInput{width:38px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--toolbar-text);border-radius:5px;padding:5px 3px;font-size:12.5px;}
  #pageInfo{color:#cfd3d8;white-space:nowrap;font-variant-numeric:tabular-nums;}
  #zoomLevel{color:#cfd3d8;min-width:38px;text-align:center;font-size:12px;}
  input[type=color]{width:26px;height:26px;border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:0;background:none;cursor:pointer;}
  #widthSlider{width:70px;}

  /* Body: sidebar + main */
  #body{flex:1;display:flex;min-height:0;}
  #sidebar{width:168px;flex:0 0 auto;background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px;display:none;}
  #sidebar.active{display:block;}
  .thumb{background:#fff;border:2px solid transparent;border-radius:6px;margin-bottom:10px;padding:6px 6px 4px;cursor:pointer;position:relative;}
  .thumb.active-thumb{border-color:var(--accent);}
  .thumb canvas{width:100%;display:block;border:1px solid var(--line);}
  .thumb .tnum{font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px;}
  .thumb .tactions{display:flex;justify-content:center;gap:4px;margin-top:4px;}
  .thumb .tactions button{border:none;background:var(--backdrop);border-radius:4px;font-size:11px;padding:3px 5px;cursor:pointer;color:var(--ink);}
  .thumb .tactions button:hover{background:#d8d3c6;}
  .thumb.drag-over{border-color:#9a9484;}
  #addPageBtnWrap{text-align:center;margin-top:4px;}
  #addPageBtnWrap button{width:100%;padding:8px;border:1.5px dashed #b7b1a3;background:transparent;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;}
  #addPageBtnWrap button:hover{border-color:var(--accent);color:var(--accent);}

  #main{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:26px 16px 60px;position:relative;}
  #pagesContainer{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .page-viewport{position:relative;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.15),0 6px 18px rgba(0,0,0,.1);}
  .base-canvas{display:block;}
  .overlay-canvas{position:absolute;top:0;left:0;touch-action:none;}
  .overlay-canvas.tool-pen,.overlay-canvas.tool-highlighter{cursor:crosshair;}
  .overlay-canvas.tool-rect,.overlay-canvas.tool-ellipse{cursor:crosshair;}
  .overlay-canvas.tool-text{cursor:text;}
  .overlay-canvas.tool-eraser{cursor:cell;}
  .overlay-canvas.tool-select{cursor:text;}
  .page-label{position:absolute;left:0;top:-17px;font-size:10.5px;color:var(--muted);}

  /* Drop zone */
  #dropzone{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
  #dropzone.hidden{display:none;}
  .dz-card{border:1.5px dashed #b7b1a3;border-radius:14px;background:#f4f2ec;padding:56px 64px;text-align:center;max-width:460px;transition:border-color .15s,background .15s;}
  .dz-card.drag{border-color:var(--accent);background:#eef4f4;}
  .dz-icon{width:56px;height:68px;margin:0 auto 18px;border:2px solid var(--muted);border-radius:6px;position:relative;}
  .dz-icon:before{content:"";position:absolute;top:-2px;right:-2px;width:14px;height:14px;background:var(--backdrop);border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);border-radius:0 0 0 4px;}
  .dz-title{font-size:17px;font-weight:600;margin-bottom:6px;}
  .dz-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
  .dz-browse{display:inline-block;background:var(--accent);color:#fff;padding:9px 18px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;}
  .dz-browse:hover{background:var(--accent-hover);}
  .dz-note{margin-top:16px;font-size:11.5px;color:#8a8577;}

  #loading{display:none;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:10px;color:var(--muted);font-size:13px;}
  #loading.active{display:flex;}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid #cfc9ba;border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:#23272f;color:#fff;padding:9px 16px;border-radius:7px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .text-editor-input{position:absolute;outline:1.5px dashed var(--accent);background:rgba(255,255,255,.7);padding:2px 4px;white-space:pre-wrap;min-width:14px;z-index:10;font-family:-apple-system,Arial,sans-serif;font-weight:600;line-height:1.25;cursor:text;border-radius:2px;}

  .form-fields-layer{position:absolute;top:0;left:0;pointer-events:none;z-index:6;}
  .form-field-input{position:absolute;pointer-events:auto;box-sizing:border-box;border:1.5px solid var(--accent);background:rgba(255,255,255,.85);font-family:inherit;padding:1px 3px;resize:none;border-radius:2px;}
  .form-field-input[type=checkbox]{padding:0;}

  .brand .byline{color:#9aa0a8;font-weight:400;font-size:11.5px;margin-left:2px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
  .claude-badge{display:inline-flex;align-items:center;gap:3px;text-decoration:none;}
  .claude-badge svg{flex:0 0 auto;display:block;}
  .claude-badge .wordmark{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:12.5px;color:#e9e9e9;letter-spacing:.2px;}
  #sourceLink{color:var(--toolbar-text);text-decoration:none;}
  #sourceLink:hover{color:#fff;}

  #searchBox{display:none;align-items:center;gap:4px;}
  #searchInput{width:120px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--toolbar-text);border-radius:5px;padding:6px 8px;font-size:12.5px;}
  #searchCount{color:#cfd3d8;font-size:11.5px;min-width:34px;text-align:center;white-space:nowrap;}

  #signedBadge{color:#9ad0a8;font-size:11.5px;white-space:nowrap;display:flex;align-items:center;gap:4px;}

  /* Sign modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,20,18,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal-card{background:var(--paper);color:var(--ink);border-radius:12px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;}
  .modal-x{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 6px;border-radius:4px;}
  .modal-x:hover{background:var(--backdrop);color:var(--ink);}
  .modal-body{padding:18px;}
  .modal-body label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  .modal-body label:first-child{margin-top:0;}
  .modal-body input[type=text],.modal-body input[type=email],.modal-body input[type=password]{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;color:var(--ink);}
  .modal-btn{width:100%;padding:10px;border-radius:7px;border:1px solid var(--line);background:var(--backdrop);
    color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;}
  .modal-btn:hover{background:#e2ddd0;}
  .modal-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .modal-btn.primary:hover{background:var(--accent-hover);}
  .modal-btn:disabled{opacity:.5;cursor:not-allowed;}
  .modal-sep{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:11px;}
  .modal-sep:before,.modal-sep:after{content:"";flex:1;height:1px;background:var(--line);}
  .modal-link{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}
  .modal-fineprint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .identity-card{background:var(--side);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.7;}
  .identity-card b{color:var(--ink);}
  .modal-error{color:var(--danger);font-size:12px;margin-top:8px;}
  .modal-spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px;}

  #printArea{display:none;}
  @media print{
    #toolbar,#sidebar,#dropzone,#loading,#toast{display:none!important;}
    #main{display:none!important;}
    body{background:#fff;}
    #printArea{display:block;}
    #printArea .print-page{page-break-after:always;display:flex;align-items:flex-start;justify-content:center;}
    #printArea .print-page:last-child{page-break-after:auto;}
    #printArea img{width:100%;height:auto;display:block;}
  }
</style>
</head>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const el = id => document.getElementById(id);

/* ---------- Global state ---------- */
let docs = [];          // {pdfjsDoc, arrayBuffer, pdfLibDoc}
let pages = [];         // page models, see below
let activeIndex = 0;
let zoom = 1.25;
let uidCounter = 1;
let currentTool = 'select';
let originalName = 'document';
let history = [], redoStack = [];
const MAX_HISTORY = 40;

/* page model:
   { uid, kind:'source'|'blank', srcDocIdx, srcPageNum, rotation, blankSize:{w,h}, annotations:[] }
   annotation: { type:'path'|'rect'|'ellipse'|'text', points:[{x,y} fractional], color, lwFrac, alpha, text, fontFrac } */

function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

function snapshot(){
  history.push(JSON.stringify(pages));
  if(history.length > MAX_HISTORY) history.shift();
  redoStack = [];
  updateUndoRedoButtons();
}
function undo(){
  if(!history.length) return;
  redoStack.push(JSON.stringify(pages));
  pages = JSON.parse(history.pop());
  clampActiveIndex();
  renderAll();
  updateUndoRedoButtons();
}
function redo(){
  if(!redoStack.length) return;
  history.push(JSON.stringify(pages));
  pages = JSON.parse(redoStack.pop());
  clampActiveIndex();
  renderAll();
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  el('undoBtn').disabled = history.length === 0;
  el('redoBtn').disabled = redoStack.length === 0;
}
function clampActiveIndex(){
  if(activeIndex >= pages.length) activeIndex = pages.length - 1;
  if(activeIndex < 0) activeIndex = 0;
}

/* ---------- Loading ---------- */
function showEditorChrome(show){
  ['insertBtn','toolSelect','toolPen','toolHighlighter','toolRect','toolEllipse','toolText','toolEraser',
   'colorPicker','widthSlider','annSep','undoBtn','redoBtn','prevBtn','pageInfo','nextBtn','zoomSep',
   'zoomOutBtn','zoomLevel','zoomInBtn','endSep','printBtn','saveBtn','signBtn',
   'ocrBtn','ocrAllBtn','ocrSep'].forEach(id => el(id).style.display = show ? '' : 'none');
  el('searchBox').style.display = show ? 'flex' : 'none';
  el('searchSep').style.display = show ? '' : 'none';
  el('sidebar').classList.toggle('active', show);
}

function setLoading(on, text){
  el('loading').classList.toggle('active', on);
  if(text) el('loadingText').textContent = text;
  el('dropzone').classList.toggle('hidden', on || pages.length>0);
}

async function loadFile(file, isMain){
  if(!file || (!/pdf$/i.test(file.name) && file.type !== 'application/pdf')){
    toast('Please choose a PDF file.'); return null;
  }
  const buf = await file.arrayBuffer();
  const loadingTask = pdfjsLib.getDocument({ data: buf.slice(0) });
  const pdfjsDoc = await loadingTask.promise;
  const docIdx = docs.length;
  docs.push({ pdfjsDoc, arrayBuffer: buf, pdfLibDoc: null, name: file.name });
  if(isMain){
    originalName = file.name.replace(/\.pdf$/i,'');
    el('fileName').textContent = file.name;
  }
  const newPages = [];
  for(let i=1;i<=pdfjsDoc.numPages;i++){
    newPages.push({ uid: uidCounter++, kind:'source', srcDocIdx: docIdx, srcPageNum: i, rotation:0, annotations:[] });
  }
  return newPages;
}

async function openMain(file){
  setLoading(true, 'Loading document…');
  docs = []; pages = []; history=[]; redoStack=[]; activeIndex = 0;
  searchMatches = []; searchCursor = -1; el('searchInput').value=''; el('searchCount').textContent='';
  formDocIdx = null; formFieldsByPage = {}; formValues = {}; formFieldsVisible = true;
  textSelectionAnchor = { pageIndex: -1, idx: -1 }; clearTextSelection(false);
  const newPages = await loadFile(file, true);
  if(!newPages){ setLoading(false); return; }
  pages = newPages;
  el('signedBadge').style.display = detectExistingSignature(docs[0].arrayBuffer) ? 'flex' : 'none';
  showEditorChrome(true);
  el('pageCount').textContent = pages.length;
  el('pagesContainer').style.display = '';
  await renderThumbnails();
  await detectForm(0);
  el('formToggleBtn').style.display = formDocIdx!=null ? '' : 'none';
  await buildPageViews();
  setLoading(false);
  updateUndoRedoButtons();
}

async function insertFile(file){
  setLoading(true, 'Merging file…');
  const newPages = await loadFile(file, false);
  setLoading(false);
  if(!newPages) return;
  snapshot();
  pages.splice(activeIndex+1, 0, ...newPages);
  activeIndex = activeIndex+1;
  await renderThumbnails();
  await buildPageViews();
  scrollToPage(activeIndex);
  toast(newPages.length + ' page(s) merged in');
}

/* ---------- Rendering ---------- */
async function getPdfjsPage(p){
  return docs[p.srcDocIdx].pdfjsDoc.getPage(p.srcPageNum);
}

async function getBaseViewport(p, scale){
  if(p.kind === 'source'){
    const page = await getPdfjsPage(p);
    const total = ((page.rotate||0) + p.rotation) % 360;
    return { viewport: page.getViewport({ scale, rotation: total }), page };
  } else {
    const swap = (p.rotation === 90 || p.rotation === 270);
    const w = (swap ? p.blankSize.h : p.blankSize.w) * scale;
    const h = (swap ? p.blankSize.w : p.blankSize.h) * scale;
    return { viewport: { width: w, height: h }, page: null };
  }
}

function drawAnnotationsOnCtx(ctx, annotations, W, H){
  annotations.forEach(a => {
    ctx.save();
    ctx.strokeStyle = a.color; ctx.fillStyle = a.color;
    ctx.lineWidth = Math.max(1, a.lwFrac * W);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = a.alpha != null ? a.alpha : 1;
    if(a.type === 'path'){
      ctx.beginPath();
      a.points.forEach((pt,i)=>{ const x=pt.x*W, y=pt.y*H; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
      ctx.stroke();
    } else if(a.type === 'rect'){
      const [p0,p1] = a.points; const x=Math.min(p0.x,p1.x)*W, y=Math.min(p0.y,p1.y)*H;
      const w=Math.abs(p1.x-p0.x)*W, h=Math.abs(p1.y-p0.y)*H;
      ctx.strokeRect(x,y,w,h);
    } else if(a.type === 'ellipse'){
      const [p0,p1] = a.points; const cx=(p0.x+p1.x)/2*W, cy=(p0.y+p1.y)/2*H;
      const rx=Math.abs(p1.x-p0.x)/2*W, ry=Math.abs(p1.y-p0.y)/2*H;
      ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
    } else if(a.type === 'text'){
      const pt = a.points[0]; const size = a.fontFrac * W;
      ctx.font = `600 ${size}px -apple-system, Arial, sans-serif`;
      ctx.textBaseline = 'top';
      const lines = String(a.text).split('\n');
      lines.forEach((line, li) => ctx.fillText(line, pt.x*W, pt.y*H + li*size*1.25));
    } else if(a.type === 'wordhighlight'){
      ctx.fillRect(a.rect.x*W, a.rect.y*H, a.rect.w*W, a.rect.h*H);
    }
    ctx.restore();
  });
}

async function renderPageComposite(p, scale){
  const { viewport, page } = await getBaseViewport(p, scale);
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(viewport.width));
  canvas.height = Math.max(1, Math.round(viewport.height));
  const ctx = canvas.getContext('2d');
  if(page){ await page.render({ canvasContext: ctx, viewport }).promise; }
  else { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  drawAnnotationsOnCtx(ctx, p.annotations, canvas.width, canvas.height);
  return canvas;
}

async function renderThumbnails(){
  const sb = el('sidebar');
  sb.innerHTML = '';
  for(let i=0;i<pages.length;i++){
    const p = pages[i];
    const wrap = document.createElement('div');
    wrap.className = 'thumb' + (i===activeIndex ? ' active-thumb' : '');
    wrap.draggable = true;
    wrap.dataset.idx = i;
    const canvas = await renderPageComposite(p, 0.18);
    canvas.style.width = '100%';
    wrap.appendChild(canvas);
    const num = document.createElement('div'); num.className='tnum'; num.textContent = 'Page ' + (i+1);
    wrap.appendChild(num);
    const actions = document.createElement('div'); actions.className='tactions';
    actions.innerHTML = `<button data-act="rotate" title="Rotate">⟳</button><button data-act="dup" title="Duplicate">⧉</button><button data-act="del" title="Delete">✕</button>`;
    wrap.appendChild(actions);

    wrap.addEventListener('click', e => {
      if(e.target.dataset.act) return;
      activeIndex = i; scrollToPage(i, true); highlightActiveThumb();
    });
    actions.querySelector('[data-act=rotate]').onclick = async () => { snapshot(); p.rotation = (p.rotation+90)%360; p.textWords = null; p._orderedWords = null; await renderThumbnails(); const keep = activeIndex; await buildPageViews(); scrollToPage(keep); };
    actions.querySelector('[data-act=dup]').onclick = () => {
      snapshot();
      const clone = JSON.parse(JSON.stringify(p)); clone.uid = uidCounter++;
      pages.splice(i+1,0,clone); activeIndex = i+1;
      renderThumbnails(); renderAll();
    };
    actions.querySelector('[data-act=del]').onclick = () => {
      if(pages.length === 1){ toast("Can't delete the only page"); return; }
      snapshot();
      pages.splice(i,1); clampActiveIndex();
      renderThumbnails(); renderAll();
    };
    wrap.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', i); });
    wrap.addEventListener('dragover', e => { e.preventDefault(); wrap.classList.add('drag-over'); });
    wrap.addEventListener('dragleave', () => wrap.classList.remove('drag-over'));
    wrap.addEventListener('drop', e => {
      e.preventDefault(); wrap.classList.remove('drag-over');
      const from = parseInt(e.dataTransfer.getData('text/plain'));
      const to = i;
      if(from === to) return;
      snapshot();
      const [moved] = pages.splice(from,1);
      pages.splice(to,0,moved);
      if(activeIndex===from) activeIndex = to;
      renderThumbnails(); renderAll();
    });

    sb.appendChild(wrap);
  }
  const addWrap = document.createElement('div'); addWrap.id='addPageBtnWrap';
  addWrap.innerHTML = '<button>+ Add blank page</button>';
  addWrap.querySelector('button').onclick = () => {
    snapshot();
    const np = { uid: uidCounter++, kind:'blank', blankSize:{w:595,h:842}, rotation:0, annotations:[] };
    pages.splice(activeIndex+1,0,np); activeIndex = activeIndex+1;
    renderThumbnails(); renderAll();
  };
  sb.appendChild(addWrap);
  el('pageCount').textContent = pages.length;
}
function highlightActiveThumb(){
  [...el('sidebar').children].forEach(c => c.classList && c.classList.remove('active-thumb'));
  const t = el('sidebar').children[activeIndex];
  if(t && t.classList) t.classList.add('active-thumb');
}

/* ---------- Continuous multi-page view ----------
   Every page lives in the scroll container at once (Word-style), so
   scrolling flows between pages instead of snapping one page at a time.
   Each page owns its own base canvas, overlay canvas and form-field layer;
   `activeIndex` is derived from whichever page is most visible. */

function viewportFor(idx){ return el('pagesContainer').children[idx] || null; }
function overlayFor(idx){ const v = viewportFor(idx); return v ? v.querySelector('.overlay-canvas') : null; }
function baseFor(idx){ const v = viewportFor(idx); return v ? v.querySelector('.base-canvas') : null; }
function formLayerFor(idx){ const v = viewportFor(idx); return v ? v.querySelector('.form-fields-layer') : null; }
function activeOverlay(){ return overlayFor(activeIndex); }
function pageIdxFromNode(node){
  const v = node && node.closest ? node.closest('.page-viewport') : null;
  return v ? parseInt(v.dataset.idx, 10) : -1;
}

// Build (or rebuild) the stack of page viewports. Canvases are sized
// immediately so the scroll height is correct, but pixels are painted lazily
// by renderVisiblePages() to keep large documents responsive.
async function buildPageViews(){
  const container = el('pagesContainer');
  container.innerHTML = '';
  for(let i=0;i<pages.length;i++){
    const { viewport } = await getBaseViewport(pages[i], zoom);
    const wrap = document.createElement('div');
    wrap.className = 'page-viewport';
    wrap.dataset.idx = i;
    wrap.style.width = viewport.width+'px';
    wrap.style.height = viewport.height+'px';
    const label = document.createElement('div');
    label.className = 'page-label';
    label.textContent = 'Page ' + (i+1);
    const base = document.createElement('canvas'); base.className = 'base-canvas';
    const overlay = document.createElement('canvas'); overlay.className = 'overlay-canvas tool-'+currentTool;
    const dpr = window.devicePixelRatio || 1;
    [base, overlay].forEach(c => {
      c.width = Math.round(viewport.width*dpr); c.height = Math.round(viewport.height*dpr);
      c.style.width = viewport.width+'px'; c.style.height = viewport.height+'px';
    });
    const formLayer = document.createElement('div');
    formLayer.className = 'form-fields-layer';
    formLayer.style.width = viewport.width+'px';
    formLayer.style.height = viewport.height+'px';
    wrap.appendChild(label); wrap.appendChild(base); wrap.appendChild(overlay); wrap.appendChild(formLayer);
    ['mousedown','touchstart'].forEach(ev => overlay.addEventListener(ev, onPointerDown, {passive:false}));
    container.appendChild(wrap);
    pages[i]._painted = false;
  }
  await renderVisiblePages();
  updateActiveFromScroll();
}

// Paint the pages currently in (or near) view.
async function renderVisiblePages(){
  const main = el('main');
  const mainRect = main.getBoundingClientRect();
  const margin = mainRect.height; // one screen of lookahead each way
  for(let i=0;i<pages.length;i++){
    const wrap = viewportFor(i);
    if(!wrap) continue;
    const r = wrap.getBoundingClientRect();
    const near = r.bottom > mainRect.top - margin && r.top < mainRect.bottom + margin;
    if(near && !pages[i]._painted){
      pages[i]._painted = true;
      await paintPage(i);
    }
  }
}

async function paintPage(idx){
  const p = pages[idx];
  const base = baseFor(idx);
  if(!base) return;
  const { viewport, page } = await getBaseViewport(p, zoom);
  const dpr = window.devicePixelRatio || 1;
  const bctx = base.getContext('2d');
  bctx.setTransform(dpr,0,0,dpr,0,0);
  if(page){ await page.render({ canvasContext: bctx, viewport }).promise; }
  else { bctx.fillStyle = '#fff'; bctx.fillRect(0,0,viewport.width,viewport.height); }
  redrawOverlayFor(idx);
  await renderFormFieldOverlay(idx);
  ensurePageTextWords(p).catch(()=>{}); // warm the word cache for select/highlight
}

// Which page is most visible right now drives the page number, thumbnail
// highlight, and any tool that acts on "the current page".
function updateActiveFromScroll(){
  if(!pages.length) return;
  const main = el('main');
  const mainRect = main.getBoundingClientRect();
  const mid = mainRect.top + mainRect.height/2;
  let best = activeIndex, bestDist = Infinity;
  for(let i=0;i<pages.length;i++){
    const wrap = viewportFor(i);
    if(!wrap) continue;
    const r = wrap.getBoundingClientRect();
    const dist = Math.abs((r.top + r.height/2) - mid);
    if(dist < bestDist){ bestDist = dist; best = i; }
  }
  if(best !== activeIndex){
    activeIndex = best;
    highlightActiveThumb();
  }
  el('pageInput').value = activeIndex+1;
  el('zoomLevel').textContent = Math.round((zoom/1.25)*100)+'%';
  el('prevBtn').disabled = activeIndex===0;
  el('nextBtn').disabled = activeIndex===pages.length-1;
}

function scrollToPage(idx, smooth){
  const wrap = viewportFor(idx);
  if(!wrap) return;
  const main = el('main');
  main.scrollTo({ top: wrap.offsetTop - main.offsetTop - 12, behavior: smooth ? 'smooth' : 'auto' });
}

el('main').addEventListener('scroll', () => {
  updateActiveFromScroll();
  renderVisiblePages();
}, { passive: true });

// Kept for callers that used to re-render the single active page; now it
// repaints the visible run and refreshes the active-page chrome.
async function renderActivePage(){
  if(!pages.length) return;
  cleanupTextEditor(false);
  clampActiveIndex();
  await renderVisiblePages();
  redrawOverlayFor(activeIndex);
  updateActiveFromScroll();
  highlightActiveThumb();
}

function drawSearchHighlights(ctx, rects, W, H){
  ctx.save();
  ctx.fillStyle = 'rgba(255,213,0,0.45)';
  rects.forEach(r => ctx.fillRect(r.x*W, r.y*H, r.w*W, r.h*H));
  ctx.restore();
}

function drawTextSelection(ctx, lineRects, W, H){
  ctx.save();
  ctx.fillStyle = 'rgba(0,120,215,0.35)';
  lineRects.forEach(r => ctx.fillRect(r.x*W, r.y*H, r.w*W, r.h*H));
  ctx.restore();
}

function redrawOverlayFor(idx){
  const overlay = overlayFor(idx);
  if(!overlay) return;
  const p = pages[idx];
  if(!p) return;
  const dpr = window.devicePixelRatio || 1;
  const octx = overlay.getContext('2d');
  octx.setTransform(dpr,0,0,dpr,0,0);
  const W = overlay.width/dpr, H = overlay.height/dpr;
  octx.clearRect(0,0,W,H);
  if(p.searchHighlights && p.searchHighlights.length) drawSearchHighlights(octx, p.searchHighlights, W, H);
  drawAnnotationsOnCtx(octx, p.annotations, W, H);
  const carried = carriedSelections.find(s => s.pageIndex === idx);
  if(carried && carried.lineRects.length) drawTextSelection(octx, carried.lineRects, W, H);
  if(textSelection.pageIndex === idx && textSelection.lineRects.length) drawTextSelection(octx, textSelection.lineRects, W, H);
}

// Repaint every page's overlay (selection spans pages, so a change on one can
// affect the highlight shown on others).
function redrawOverlay(){
  for(let i=0;i<pages.length;i++) redrawOverlayFor(i);
}

async function renderAll(){
  await renderThumbnails();
  const keep = activeIndex;
  await buildPageViews();
  scrollToPage(keep);
}

/* ---------- Annotation interaction ---------- */
let drawing = false, startPt = null, currentPath = null, liveShape = null;
let selectMode = false, selectOrderedWords = [], selectStartIdx = -1, selectPreviewLines = null;
let textSelection = { pageIndex: null, words: [], lineRects: [], text: '' };
// Selections completed on earlier pages during one continuous drag, kept so a
// drag that auto-advances pages copies everything it crossed rather than only
// whatever happens to be on the final page. Keyed by page index, in the order
// the drag visited them.
let carriedSelections = [];

function clearTextSelection(redraw){
  textSelection = { pageIndex: null, words: [], lineRects: [], text: '' };
  carriedSelections = [];
  textSelectionAnchor = { pageIndex: -1, idx: -1 };
  selectFocus = { pageIndex: -1, idx: -1 };
  if(redraw !== false && pages.length) redrawOverlay();
}

// Full selected text across every page the drag covered, in visit order.
function fullSelectionText(){
  const parts = carriedSelections.map(s => s.text).filter(Boolean);
  if(textSelection.text) parts.push(textSelection.text);
  return parts.join('\n');
}
function fullSelectionWordCount(){
  return carriedSelections.reduce((n,s) => n + s.words.length, 0) + textSelection.words.length;
}

// Find the word whose line is closest to pt.y, then the closest word on that
// line by x — mirrors how native text selection anchors to the nearest glyph
// rather than requiring the pointer to be exactly over a word.
function nearestWordIndex(orderedWords, pt){
  if(!orderedWords.length) return -1;
  let lineY = null, bestLineDist = Infinity;
  orderedWords.forEach(w => {
    const cy = w.rectFrac.y + w.rectFrac.h/2;
    const d = Math.abs(cy - pt.y);
    if(d < bestLineDist){ bestLineDist = d; lineY = cy; }
  });
  const avgH = orderedWords.reduce((s,w)=>s+w.rectFrac.h,0)/orderedWords.length || 0.01;
  const lineTol = avgH * 0.6;
  const sameLine = [];
  orderedWords.forEach((w,i) => {
    const cy = w.rectFrac.y + w.rectFrac.h/2;
    if(Math.abs(cy - lineY) < lineTol) sameLine.push(i);
  });
  // If the point falls inside a word's own box, use that word directly —
  // comparing only center distance can snap a click near a word's edge to a
  // closer, narrower neighbor instead of the word actually under the pointer.
  for(const i of sameLine){
    const w = orderedWords[i];
    if(pt.x >= w.rectFrac.x && pt.x <= w.rectFrac.x + w.rectFrac.w) return i;
  }
  let best = -1, bestDx = Infinity;
  sameLine.forEach(i => {
    const w = orderedWords[i];
    const cx = w.rectFrac.x + w.rectFrac.w/2;
    const d = Math.abs(cx - pt.x);
    if(d < bestDx){ bestDx = d; best = i; }
  });
  return best;
}

// Merge a run of selected words (already in reading order) into one
// continuous rect per line, filling the gaps between words — this is what
// makes it read as a real text selection (like Word/Google Docs) instead of
// a row of separate word boxes.
function mergeSelectionIntoLines(words){
  if(!words.length) return [];
  const avgH = words.reduce((s,w)=>s+w.rectFrac.h,0)/words.length || 0.01;
  const rowTol = avgH * 0.6;
  const lines = [];
  words.forEach(w => {
    const cy = w.rectFrac.y + w.rectFrac.h/2;
    let line = lines.find(l => Math.abs(l.cy - cy) < rowTol);
    if(!line){ line = { cy, x0:Infinity, x1:-Infinity, y0:Infinity, y1:-Infinity }; lines.push(line); }
    line.x0 = Math.min(line.x0, w.rectFrac.x);
    line.x1 = Math.max(line.x1, w.rectFrac.x + w.rectFrac.w);
    line.y0 = Math.min(line.y0, w.rectFrac.y);
    line.y1 = Math.max(line.y1, w.rectFrac.y + w.rectFrac.h);
  });
  return lines.map(l => ({ x: l.x0, y: l.y0, w: l.x1-l.x0, h: l.y1-l.y0 }));
}

function sortWordsReadingOrder(words){
  const avgH = words.reduce((s,w)=>s+w.rectFrac.h,0)/words.length || 0.01;
  const rowTol = avgH * 0.6;
  const sorted = [...words].sort((a,b)=> a.rectFrac.y - b.rectFrac.y);
  const lines = [];
  sorted.forEach(w => {
    let line = lines.find(l => Math.abs(l.y - w.rectFrac.y) < rowTol);
    if(!line){ line = { y: w.rectFrac.y, items: [] }; lines.push(line); }
    line.items.push(w);
  });
  lines.sort((a,b)=>a.y-b.y);
  lines.forEach(l => l.items.sort((a,b)=>a.rectFrac.x-b.rectFrac.x));
  return lines.flatMap(l => l.items);
}

async function copySelectionToClipboard(){
  const text = fullSelectionText();
  if(!text) return;
  try{
    await navigator.clipboard.writeText(text);
  } catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    } catch(err){ toast('Copy failed — no clipboard access.'); return; }
  }
  const pageCount = carriedSelections.length + (textSelection.words.length ? 1 : 0);
  toast('Copied ' + fullSelectionWordCount() + ' word(s)' + (pageCount > 1 ? ' across ' + pageCount + ' pages' : ''));
}

// Fractional coords within a given page (defaults to the interaction page).
function fracFromEvent(e, idx){
  const overlay = overlayFor(idx == null ? interactionPageIdx : idx) || activeOverlay();
  if(!overlay) return { x:0, y:0 };
  const rect = overlay.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: Math.min(1,Math.max(0,(cx-rect.left)/rect.width)), y: Math.min(1,Math.max(0,(cy-rect.top)/rect.height)) };
}

// The page a drag started on — annotation strokes belong to it even if the
// pointer wanders over a neighbouring page mid-gesture.
let interactionPageIdx = 0;

// Which page a raw viewport point falls on (clamped to the nearest page when
// the pointer is in the gap between pages).
function pageIdxAtClientY(clientY){
  let best = interactionPageIdx, bestDist = Infinity;
  for(let i=0;i<pages.length;i++){
    const wrap = viewportFor(i);
    if(!wrap) continue;
    const r = wrap.getBoundingClientRect();
    if(clientY >= r.top && clientY <= r.bottom) return i;
    const dist = clientY < r.top ? r.top - clientY : clientY - r.bottom;
    if(dist < bestDist){ bestDist = dist; best = i; }
  }
  return best;
}
function currentAnnColor(){ return el('colorPicker').value; }
function currentAnnWidthFrac(){
  const overlay = overlayFor(interactionPageIdx) || activeOverlay();
  const w = overlay ? overlay.getBoundingClientRect().width : 0;
  return parseFloat(el('widthSlider').value) / (w || 800);
}

let wordSelectMode = false, wordSelectRect = null;
let textSelectionAnchor = { pageIndex: -1, idx: -1 }, selectIsShiftExtend = false;
let lastClientX = null, lastClientY = null, autoScrollDy = 0, autoScrollHandle = null;

function rectsIntersect(a, b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function rectContainsPt(r, pt){
  return pt.x >= r.x && pt.x <= r.x+r.w && pt.y >= r.y && pt.y <= r.y+r.h;
}

// Recompute the live selection preview from a raw viewport point (used both
// by mousemove and by the auto-scroll loop, since scrolling moves the page
// under a pointer that hasn't itself moved).
function updateSelectionPreviewFromClientPt(clientX, clientY){
  const overlay = overlayFor(interactionPageIdx);
  if(!overlay) return { x:0, y:0 };
  const rect = overlay.getBoundingClientRect();
  const pt = { x: Math.min(1,Math.max(0,(clientX-rect.left)/rect.width)), y: Math.min(1,Math.max(0,(clientY-rect.top)/rect.height)) };
  if(selectStartIdx >= 0 && selectOrderedWords.length){
    const endIdx = nearestWordIndex(selectOrderedWords, pt);
    const a = Math.min(selectStartIdx, endIdx), b = Math.max(selectStartIdx, endIdx);
    const run = selectOrderedWords.slice(a, b+1);
    selectPreviewLines = mergeSelectionIntoLines(run);
  }
  const dpr = window.devicePixelRatio||1;
  const W = overlay.width/dpr, H = overlay.height/dpr;
  redrawOverlay();
  if(selectPreviewLines && selectPreviewLines.length) drawTextSelection(overlay.getContext('2d'), selectPreviewLines, W, H);
  return pt;
}

/* ---------- Auto-scroll while dragging a selection ----------
   With every page stacked in one scroller there are no page "turns" any more:
   dragging past the edge just keeps scrolling, and the selection extends onto
   whatever page scrolls into view. */
function autoScrollStep(){
  if(!drawing || autoScrollDy === 0){ autoScrollHandle = null; return; }
  const main = el('main');
  const maxScroll = main.scrollHeight - main.clientHeight;
  const next = Math.max(0, Math.min(maxScroll, main.scrollTop + autoScrollDy));
  if(next === main.scrollTop){ autoScrollHandle = null; return; } // hit the document end
  main.scrollTop = next;
  renderVisiblePages();
  if(selectMode && lastClientX != null) extendSelectionToClientPt(lastClientX, lastClientY);
  autoScrollHandle = requestAnimationFrame(autoScrollStep);
}
function updateAutoScroll(clientY){
  const rect = el('main').getBoundingClientRect();
  const EDGE = 44, MAXSPEED = 22;
  if(clientY > rect.bottom - EDGE) autoScrollDy = MAXSPEED * Math.min(1, (clientY-(rect.bottom-EDGE))/EDGE);
  else if(clientY < rect.top + EDGE) autoScrollDy = -MAXSPEED * Math.min(1, ((rect.top+EDGE)-clientY)/EDGE);
  else autoScrollDy = 0;
  if(autoScrollDy !== 0 && autoScrollHandle == null) autoScrollHandle = requestAnimationFrame(autoScrollStep);
}
function stopAutoScroll(){
  autoScrollDy = 0;
  if(autoScrollHandle != null){ cancelAnimationFrame(autoScrollHandle); autoScrollHandle = null; }
}

/* ---------- Cross-page text selection ----------
   The anchor is a (page, word) pair and so is the focus; everything between
   them — including whole pages in the middle — is selected, which is what a
   continuous document view lets us finally do properly. */
let selectFocus = { pageIndex: -1, idx: -1 };

async function wordsForPage(idx){
  const p = pages[idx];
  if(!p) return [];
  if(p._orderedWords && p._orderedWordsZoomToken === p.textWords) return p._orderedWords;
  const words = await ensurePageTextWords(p);
  p._orderedWords = sortWordsReadingOrder(words);
  p._orderedWordsZoomToken = p.textWords;
  return p._orderedWords;
}

// Build the selection spanning anchor -> focus and paint every page it covers.
function applyCrossPageSelection(anchor, focus){
  if(anchor.pageIndex < 0 || focus.pageIndex < 0) return;
  let a = anchor, b = focus;
  if(b.pageIndex < a.pageIndex || (b.pageIndex === a.pageIndex && b.idx < a.idx)){ a = focus; b = anchor; }
  carriedSelections = [];
  textSelection = { pageIndex: null, words: [], lineRects: [], text: '' };
  for(let i = a.pageIndex; i <= b.pageIndex; i++){
    const ordered = pages[i] && pages[i]._orderedWords;
    if(!ordered || !ordered.length) continue;
    const from = (i === a.pageIndex) ? a.idx : 0;
    const to   = (i === b.pageIndex) ? b.idx : ordered.length - 1;
    const run = ordered.slice(Math.max(0,from), Math.min(ordered.length-1,to) + 1);
    if(!run.length) continue;
    const entry = { pageIndex: i, words: run, lineRects: mergeSelectionIntoLines(run), text: run.map(w=>w.text).join(' ') };
    if(i === b.pageIndex) textSelection = entry;
    else carriedSelections.push(entry);
  }
  redrawOverlay();
}

// Move the selection's focus end to a raw viewport point, loading that page's
// words on demand so a drag can run onto pages that were never visited.
async function extendSelectionToClientPt(clientX, clientY){
  if(!selectMode) return;
  const idx = pageIdxAtClientY(clientY);
  const ordered = await wordsForPage(idx);
  if(!ordered.length) return;
  const overlay = overlayFor(idx);
  if(!overlay) return;
  const r = overlay.getBoundingClientRect();
  const pt = { x: Math.min(1,Math.max(0,(clientX-r.left)/r.width)), y: Math.min(1,Math.max(0,(clientY-r.top)/r.height)) };
  const wIdx = nearestWordIndex(ordered, pt);
  if(wIdx < 0) return;
  selectFocus = { pageIndex: idx, idx: wIdx };
  applyCrossPageSelection(textSelectionAnchor, selectFocus);
}

// Words on the same visual line as the given word index, as an [a,b] range
// into the reading-order array (used by triple-click line selection).
function lineRangeAround(orderedWords, idx){
  const avgH = orderedWords.reduce((s,w)=>s+w.rectFrac.h,0)/orderedWords.length || 0.01;
  const tol = avgH * 0.6;
  const cy = orderedWords[idx].rectFrac.y + orderedWords[idx].rectFrac.h/2;
  let a = idx, b = idx;
  while(a-1 >= 0 && Math.abs((orderedWords[a-1].rectFrac.y + orderedWords[a-1].rectFrac.h/2) - cy) < tol) a--;
  while(b+1 < orderedWords.length && Math.abs((orderedWords[b+1].rectFrac.y + orderedWords[b+1].rectFrac.h/2) - cy) < tol) b++;
  return [a, b];
}

function commitSelectionRange(orderedWords, a, b, announce, pageIdx){
  const run = orderedWords.slice(a, b+1);
  if(!run.length) return;
  const target = pageIdx == null ? activeIndex : pageIdx;
  textSelection = { pageIndex: target, words: run, lineRects: mergeSelectionIntoLines(run), text: run.map(w=>w.text).join(' ') };
  redrawOverlay();
  if(announce !== false) toast('Selected ' + fullSelectionWordCount() + ' word(s) — press Ctrl/Cmd+C to copy');
}

async function selectAllOnPage(){
  if(!pages.length) return;
  const ordered = await wordsForPage(activeIndex);
  if(!ordered.length) return;
  carriedSelections = [];
  commitSelectionRange(ordered, 0, ordered.length - 1, true, activeIndex);
}

async function onPointerDown(e){
  if(!pages.length) return;
  e.preventDefault();
  // the gesture belongs to the page it started on, not whichever page happens
  // to be the most visible one
  const startedOn = pageIdxFromNode(e.target);
  interactionPageIdx = startedOn >= 0 ? startedOn : activeIndex;
  const pIdx = interactionPageIdx;
  const pt = fracFromEvent(e, pIdx);
  if(currentTool === 'select'){
    const p = pages[pIdx];
    const words = await ensurePageTextWords(p);
    if(!words.length) return;
    // detail counts clicks in a rapid sequence: 2 = word, 3+ = whole line,
    // matching text-selection behavior everywhere else.
    if(e.detail >= 2 && !e.shiftKey){
      const ordered = await wordsForPage(pIdx);
      const idx = nearestWordIndex(ordered, pt);
      if(idx >= 0){
        carriedSelections = [];
        const [a, b] = e.detail >= 3 ? lineRangeAround(ordered, idx) : [idx, idx];
        textSelectionAnchor = { pageIndex: pIdx, idx: a };
        commitSelectionRange(ordered, a, b, true, pIdx);
      }
      drawing = false; selectMode = false;
      return;
    }
    drawing = true; startPt = pt; selectMode = true;
    selectOrderedWords = await wordsForPage(pIdx);
    if(e.shiftKey && textSelectionAnchor.pageIndex >= 0 && textSelectionAnchor.idx >= 0){
      // shift-click/drag extends the existing selection from its original
      // anchor to this new point, the standard "select from X to Y" shortcut
      selectStartIdx = textSelectionAnchor.idx;
      selectIsShiftExtend = true;
    } else {
      // a fresh drag starts a new selection — drop anything carried from a
      // previous multi-page drag so old pages don't stay highlighted
      carriedSelections = [];
      selectStartIdx = nearestWordIndex(selectOrderedWords, pt);
      textSelectionAnchor = { pageIndex: pIdx, idx: selectStartIdx };
      selectIsShiftExtend = false;
    }
    selectPreviewLines = null;
    lastClientX = (e.touches ? e.touches[0].clientX : e.clientX);
    lastClientY = (e.touches ? e.touches[0].clientY : e.clientY);
    await extendSelectionToClientPt(lastClientX, lastClientY);
    return;
  }
  if(currentTool === 'text'){
    const idx = findTextAt(pt);
    if(idx >= 0) openTextEditor(pages[pIdx].annotations[idx].points[0], idx);
    else openTextEditor(pt, null);
    return;
  }
  if(currentTool === 'eraser'){
    eraseAt(pt);
    return;
  }
  if(currentTool === 'highlighter'){
    const p = pages[pIdx];
    const words = await ensurePageTextWords(p);
    if(words.length){
      // snap-to-word mode: drag a box (or click one word) instead of freehand ink
      drawing = true; startPt = pt; wordSelectMode = true;
      wordSelectRect = { x: pt.x, y: pt.y, w: 0, h: 0 };
      return;
    }
  }
  drawing = true; startPt = pt; wordSelectMode = false;
  if(currentTool === 'pen' || currentTool === 'highlighter'){
    currentPath = { type:'path', points:[pt], color: currentAnnColor(),
      lwFrac: currentAnnWidthFrac() * (currentTool==='highlighter'?4:1),
      alpha: currentTool==='highlighter' ? 0.35 : 1 };
  } else if(currentTool === 'rect' || currentTool === 'ellipse'){
    liveShape = { type: currentTool, points:[pt,pt], color: currentAnnColor(), lwFrac: currentAnnWidthFrac(), alpha:1 };
  }
}
function onPointerMove(e){
  if(!drawing) return;
  e.preventDefault();
  const pt = fracFromEvent(e);
  if(selectMode){
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    lastClientX = cx; lastClientY = cy;
    extendSelectionToClientPt(cx, cy);
    updateAutoScroll(cy);
    return;
  }
  if(wordSelectMode){
    wordSelectRect = {
      x: Math.min(startPt.x, pt.x), y: Math.min(startPt.y, pt.y),
      w: Math.abs(pt.x-startPt.x), h: Math.abs(pt.y-startPt.y)
    };
    const overlay = overlayFor(interactionPageIdx), dpr = window.devicePixelRatio||1;
    if(!overlay) return;
    const W = overlay.width/dpr, H = overlay.height/dpr;
    redrawOverlay();
    const octx = overlay.getContext('2d');
    octx.save(); octx.fillStyle = 'rgba(44,95,111,0.18)'; octx.strokeStyle = 'rgba(44,95,111,0.6)'; octx.lineWidth = 1;
    octx.fillRect(wordSelectRect.x*W, wordSelectRect.y*H, wordSelectRect.w*W, wordSelectRect.h*H);
    octx.strokeRect(wordSelectRect.x*W, wordSelectRect.y*H, wordSelectRect.w*W, wordSelectRect.h*H);
    octx.restore();
    return;
  }
  const liveOverlay = overlayFor(interactionPageIdx);
  if(!liveOverlay) return;
  const liveDpr = window.devicePixelRatio||1;
  if(currentPath){
    currentPath.points.push(pt);
    redrawOverlayFor(interactionPageIdx);
    drawAnnotationsOnCtx(liveOverlay.getContext('2d'), [currentPath], liveOverlay.width/liveDpr, liveOverlay.height/liveDpr);
  } else if(liveShape){
    liveShape.points[1] = pt;
    redrawOverlayFor(interactionPageIdx);
    drawAnnotationsOnCtx(liveOverlay.getContext('2d'), [liveShape], liveOverlay.width/liveDpr, liveOverlay.height/liveDpr);
  }
}
async function onPointerUp(e){
  if(!drawing) return;
  drawing = false;
  const p = pages[interactionPageIdx];
  if(selectMode){
    selectMode = false;
    stopAutoScroll();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    const pt = fracFromEvent(e, interactionPageIdx);
    const moved = Math.hypot(pt.x-startPt.x, pt.y-startPt.y);
    if(moved < 0.004 && !selectIsShiftExtend){
      // a plain click with no drag: clear rather than select one word, matching
      // how a click (not a drag) behaves in a normal text selection UI
      selectPreviewLines = null; selectOrderedWords = []; selectStartIdx = -1;
      clearTextSelection();
      return;
    }
    if(cx != null) await extendSelectionToClientPt(cx, cy);
    const n = fullSelectionWordCount();
    if(n){
      const pageCount = carriedSelections.length + (textSelection.words.length ? 1 : 0);
      toast('Selected ' + n + ' word(s)' + (pageCount > 1 ? ' across ' + pageCount + ' pages' : '') + ' — press Ctrl/Cmd+C to copy');
    }
    selectPreviewLines = null; selectOrderedWords = []; selectStartIdx = -1; selectIsShiftExtend = false;
    return;
  }
  if(wordSelectMode){
    const words = await ensurePageTextWords(p);
    const color = currentAnnColor();
    let hitRect = wordSelectRect;
    if(hitRect.w < 0.004 && hitRect.h < 0.004){
      // treat as a click: highlight the single word under the pointer
      const hit = words.find(w => rectContainsPt(w.rectFrac, startPt));
      if(hit) hitRect = hit.rectFrac;
      else hitRect = null;
    }
    const matched = hitRect ? words.filter(w => rectsIntersect(w.rectFrac, hitRect)) : [];
    if(matched.length){
      snapshot();
      matched.forEach(w => p.annotations.push({ type:'wordhighlight', rect: w.rectFrac, color, alpha:0.4 }));
    }
    wordSelectMode = false; wordSelectRect = null;
    redrawOverlay(); renderThumbnails();
    return;
  }
  if(currentPath && currentPath.points.length>1){ snapshot(); p.annotations.push(currentPath); }
  if(liveShape){ snapshot(); p.annotations.push(liveShape); }
  currentPath = null; liveShape = null;
  redrawOverlay(); renderThumbnails();
}
function findTextAt(pt){
  const p = pages[interactionPageIdx];
  for(let i=p.annotations.length-1;i>=0;i--){
    const a = p.annotations[i];
    if(a.type !== 'text') continue;
    const q = a.points[0];
    const lines = String(a.text).split('\n');
    const maxLen = Math.max(...lines.map(l=>l.length), 1);
    const w = maxLen * a.fontFrac * 0.55;
    const h = lines.length * a.fontFrac * 1.3;
    if(pt.x >= q.x-0.01 && pt.x <= q.x+w+0.02 && pt.y >= q.y-0.01 && pt.y <= q.y+h+0.02) return i;
  }
  return -1;
}

let activeEditor = null;
function cleanupTextEditor(commit){
  if(!activeEditor) return;
  const fn = commit ? activeEditor._commit : activeEditor._cancel;
  fn && fn();
}

function openTextEditor(pt, existingIdx){
  cleanupTextEditor(true);
  const pageIdx = interactionPageIdx;
  const p = pages[pageIdx];
  const overlay = overlayFor(pageIdx);
  if(!overlay) return;
  const rect = overlay.getBoundingClientRect();
  let fontFrac, initialText = '', color;
  if(existingIdx != null){
    const a = p.annotations[existingIdx];
    fontFrac = a.fontFrac; initialText = a.text; color = a.color;
  } else {
    fontFrac = 0.03 + (parseFloat(el('widthSlider').value)/300);
    color = currentAnnColor();
  }
  const editor = document.createElement('div');
  editor.className = 'text-editor-input';
  editor.contentEditable = 'true';
  editor.spellcheck = false;
  editor.style.left = (pt.x*rect.width) + 'px';
  editor.style.top = (pt.y*rect.height) + 'px';
  editor.style.fontSize = (fontFrac*rect.width) + 'px';
  editor.style.color = color;
  editor.textContent = initialText;
  viewportFor(pageIdx).appendChild(editor);
  activeEditor = editor;
  editor.focus();
  if(initialText){
    const range = document.createRange(); range.selectNodeContents(editor);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  }
  let done = false;
  editor._commit = () => {
    if(done) return; done = true;
    const text = editor.innerText.replace(/\n+$/,'');
    editor.remove(); if(activeEditor===editor) activeEditor = null;
    if(existingIdx != null){
      snapshot();
      p.annotations.splice(existingIdx,1);
      if(text.trim()) p.annotations.push({ type:'text', points:[pt], color, lwFrac:0, fontFrac, text });
    } else if(text.trim()){
      snapshot();
      p.annotations.push({ type:'text', points:[pt], color, lwFrac:0, fontFrac, text });
    }
    redrawOverlay(); renderThumbnails();
  };
  editor._cancel = () => {
    if(done) return; done = true;
    editor.remove(); if(activeEditor===editor) activeEditor = null;
  };
  editor.addEventListener('blur', () => editor._commit());
  editor.addEventListener('keydown', e => {
    e.stopPropagation();
    if(e.key === 'Escape'){ e.preventDefault(); editor._cancel(); }
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); editor.blur(); }
  });
}

function eraseAt(pt){
  const p = pages[interactionPageIdx];
  for(let i=p.annotations.length-1;i>=0;i--){
    const a = p.annotations[i];
    let hit = false;
    if(a.type === 'path'){
      hit = a.points.some(q => Math.hypot(q.x-pt.x, q.y-pt.y) < 0.02);
    } else if(a.type === 'rect' || a.type === 'ellipse'){
      const [p0,p1] = a.points;
      const minX=Math.min(p0.x,p1.x)-0.01, maxX=Math.max(p0.x,p1.x)+0.01;
      const minY=Math.min(p0.y,p1.y)-0.01, maxY=Math.max(p0.y,p1.y)+0.01;
      hit = pt.x>=minX && pt.x<=maxX && pt.y>=minY && pt.y<=maxY;
    } else if(a.type === 'text'){
      const q = a.points[0];
      hit = Math.abs(q.x-pt.x) < 0.15 && Math.abs(q.y-pt.y) < 0.05;
    } else if(a.type === 'wordhighlight'){
      hit = rectContainsPt(a.rect, pt);
    }
    if(hit){ snapshot(); p.annotations.splice(i,1); redrawOverlay(); renderThumbnails(); return; }
  }
}
// mousedown is bound per page overlay in buildPageViews().
// mousemove/mouseup are bound on window (not just the canvas) so an in-progress
// drag — a pen stroke, a text selection reaching toward the page edge for
// auto-scroll, etc. — isn't cut short the moment the pointer crosses the
// canvas boundary (the canvas is only as big as the rendered page, centered
// with padding around it, so this happens often). Handlers already no-op via
// the `drawing` guard when nothing is in progress.
['mousemove','touchmove'].forEach(ev => window.addEventListener(ev, onPointerMove, {passive:false}));
['mouseup','touchend'].forEach(ev => window.addEventListener(ev, onPointerUp, {passive:false}));

function setTool(t){
  cleanupTextEditor(false);
  if(t !== 'select'){ clearTextSelection(); textSelectionAnchor = { pageIndex: -1, idx: -1 }; }
  currentTool = t;
  ['select','pen','highlighter','rect','ellipse','text','eraser'].forEach(name => {
    const btn = el('tool'+name.charAt(0).toUpperCase()+name.slice(1));
    if(btn) btn.classList.toggle('active', name===t);
  });
  const container = el('pagesContainer');
  [...container.querySelectorAll('.overlay-canvas')].forEach(c => c.className = 'overlay-canvas tool-'+t);
}
[['toolSelect','select'],['toolPen','pen'],['toolHighlighter','highlighter'],['toolRect','rect'],
 ['toolEllipse','ellipse'],['toolText','text'],['toolEraser','eraser']].forEach(([id,t])=>{
  el(id).onclick = () => setTool(t);
});

el('openBtn').onclick = () => el('fileInput').click();
el('fileInput').onchange = e => { if(e.target.files[0]) openMain(e.target.files[0]); e.target.value=''; };

['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); el('dzCard').classList.remove('drag'); }));

function jumpTo(v){ let n = parseInt(v)-1; if(isNaN(n)) return; n = Math.min(pages.length-1, Math.max(0,n)); activeIndex=n; scrollToPage(n, true); highlightActiveThumb(); }

el('zoomInBtn').onclick = async () => { zoom = Math.min(3, zoom+0.25); const keep = activeIndex; await buildPageViews(); scrollToPage(keep); };
el('zoomOutBtn').onclick = async () => { zoom = Math.max(0.5, zoom-0.25); const keep = activeIndex; await buildPageViews(); scrollToPage(keep); };
el('undoBtn').onclick = undo;
